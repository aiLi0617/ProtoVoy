name: CI

# Jobs run only when matching paths change. Docs, skills, and other
# non-build files do not start this workflow. Use workflow_dispatch to force
# a full run.
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "crates/**"
      - "packages/**"
      - "services/collaboration-server/**"
      - "e2e/**"
      - "scripts/prepare-sidecar.mjs"
      - "scripts/run-tsx-tests.mjs"
      - "scripts/test-changed-e2e.mjs"
      - "scripts/test-changed-ui.mjs"
      - "scripts/validate-changed.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playwright.config.ts"
      - ".npmrc"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "crates/**"
      - "packages/**"
      - "services/collaboration-server/**"
      - "e2e/**"
      - "scripts/prepare-sidecar.mjs"
      - "scripts/run-tsx-tests.mjs"
      - "scripts/test-changed-e2e.mjs"
      - "scripts/test-changed-ui.mjs"
      - "scripts/validate-changed.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "playwright.config.ts"
      - ".npmrc"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      ts: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ts }}
      rust: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.rust }}
      e2e: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.e2e }}
      desktop: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.desktop }}
      desktop_pr: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.desktop_pr }}
      java: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.java }}
      security: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.security }}
      workflow: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            ts:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'packages/**'
              - 'apps/web/**'
              - 'apps/desktop/**'
              - '!apps/desktop/src-tauri/**'
              - 'scripts/validate-changed.mjs'
              - 'scripts/run-tsx-tests.mjs'
              - 'scripts/test-changed-ui.mjs'
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'crates/**'
              - 'apps/cli/**'
              - 'apps/local-agent/**'
              - 'apps/protocol-gateway/**'
              - 'apps/desktop/src-tauri/**'
            e2e:
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'packages/request-model/**'
              - 'scripts/test-changed-e2e.mjs'
            desktop:
              - 'apps/desktop/**'
              - 'apps/local-agent/**'
              - 'scripts/prepare-sidecar.mjs'
              - 'packages/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            desktop_pr:
              - 'apps/desktop/**'
              - 'apps/local-agent/**'
              - 'scripts/prepare-sidecar.mjs'
            java:
              - 'services/collaboration-server/**'
            security:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
            workflow:
              - '.github/workflows/ci.yml'

  test-js:
    needs: changes
    if: needs.changes.outputs.ts == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate affected workspaces
        if: github.event_name == 'pull_request' && needs.changes.outputs.workflow != 'true'
        run: pnpm validate:changed --js --base "${{ github.event.pull_request.base.sha }}"
      - name: Run full JavaScript and TypeScript validation
        if: github.event_name != 'pull_request' || needs.changes.outputs.workflow == 'true'
        run: pnpm typecheck && pnpm test

  test-e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Run affected browser tests
        if: github.event_name == 'pull_request' && needs.changes.outputs.workflow != 'true'
        run: pnpm test:e2e:changed --base "${{ github.event.pull_request.base.sha }}" --workers=2
      - name: Run full browser tests
        if: github.event_name != 'pull_request' || needs.changes.outputs.workflow == 'true'
        run: pnpm test:e2e --workers=2

  test-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect whether affected Rust crates include the desktop shell
        id: rust-scope
        if: github.event_name == 'pull_request' && needs.changes.outputs.workflow != 'true'
        shell: bash
        run: |
          if node scripts/validate-changed.mjs --rust --base "${{ github.event.pull_request.base.sha }}" --dry-run | grep -Eq -- '--workspace|--package protovoy-desktop'; then
            echo 'desktop=true' >> "$GITHUB_OUTPUT"
          else
            echo 'desktop=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Linux desktop libraries
        if: github.event_name != 'pull_request' || needs.changes.outputs.workflow == 'true' || steps.rust-scope.outputs.desktop == 'true'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Ensure Tauri frontendDist exists for workspace Cargo
        if: github.event_name != 'pull_request' || needs.changes.outputs.workflow == 'true' || steps.rust-scope.outputs.desktop == 'true'
        run: mkdir -p apps/desktop/dist && test -f apps/desktop/dist/index.html || printf '%s\n' '<!doctype html><title>ProtoVoy</title>' > apps/desktop/dist/index.html
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate affected Rust workspaces
        if: github.event_name == 'pull_request' && needs.changes.outputs.workflow != 'true'
        run: node scripts/validate-changed.mjs --rust --base "${{ github.event.pull_request.base.sha }}"
      - name: Run full Rust validation
        if: github.event_name != 'pull_request' || needs.changes.outputs.workflow == 'true'
        run: cargo test --workspace --locked && cargo clippy --workspace --all-targets --locked -- -D warnings

  desktop-check:
    needs: changes
    if: >-
      needs.changes.outputs.workflow == 'true' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.desktop_pr == 'true') ||
      (github.event_name != 'pull_request' && needs.changes.outputs.desktop == 'true')
    strategy:
      fail-fast: false
      # Pull requests get a fast Linux compile check. Main and manually
      # dispatched runs retain the full cross-platform matrix.
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-14","windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build Tauri frontend assets
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          ESBUILD_WORKER_THREADS: 1
        run: pnpm --filter @protovoy/desktop build
      - run: pnpm prepare:sidecar
      - run: cargo check -p protovoy-desktop --locked

  security:
    needs: changes
    if: needs.changes.outputs.security == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit Rust dependencies
        # .cargo/audit.toml contains the reviewed, exact-ID upstream exceptions.
        # Any newly reported vulnerability or warning must fail this job.
        run: cargo audit -D warnings
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: protovoy-sbom.cdx.json
          upload-artifact: true

  collaboration-server:
    needs: changes
    if: needs.changes.outputs.java == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/collaboration-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v6
      - run: ./gradlew clean test bootJar --no-daemon

  ci:
    name: CI
    needs:
      - changes
      - test-js
      - test-e2e
      - test-rust
      - desktop-check
      - security
      - collaboration-server
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check selected jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = [name for name, info in needs.items() if info.get("result") in ("failure", "cancelled")]
          if failed:
              print("failed or cancelled:", ", ".join(failed))
              sys.exit(1)
          print("ok")
          PY
