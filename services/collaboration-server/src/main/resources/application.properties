spring.application.name=collaboration-server
server.port=${PROTOVOY_COLLAB_PORT:8088}
server.forward-headers-strategy=framework
spring.datasource.url=${PROTOVOY_COLLAB_DATABASE_URL:jdbc:h2:file:./data/protovoy-collaboration;AUTO_SERVER=TRUE}
spring.datasource.username=${PROTOVOY_COLLAB_DATABASE_USER:sa}
spring.datasource.password=${PROTOVOY_COLLAB_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
server.error.include-message=always
protovoy.bootstrap-token=${PROTOVOY_COLLAB_BOOTSTRAP_TOKEN:change-me-before-production}
protovoy.allowed-origins=${PROTOVOY_COLLAB_ALLOWED_ORIGINS:http://localhost:5180,http://127.0.0.1:5180,tauri://localhost,http://tauri.localhost}
protovoy.sso.enabled=${PROTOVOY_COLLAB_SSO_ENABLED:false}
protovoy.sso.organization-id=${PROTOVOY_COLLAB_SSO_ORGANIZATION_ID:}
protovoy.sso.default-role=${PROTOVOY_COLLAB_SSO_DEFAULT_ROLE:VIEWER}
protovoy.sso.web-redirect=${PROTOVOY_COLLAB_SSO_WEB_REDIRECT:http://localhost:5180}
spring.security.oauth2.client.registration.oidc.client-id=${PROTOVOY_COLLAB_OIDC_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.oidc.client-secret=${PROTOVOY_COLLAB_OIDC_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.oidc.scope=openid,profile,email
spring.security.oauth2.client.registration.oidc.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.oidc.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.oidc.authorization-uri=${PROTOVOY_COLLAB_OIDC_AUTHORIZATION_URI:https://invalid.local/authorize}
spring.security.oauth2.client.provider.oidc.token-uri=${PROTOVOY_COLLAB_OIDC_TOKEN_URI:https://invalid.local/token}
spring.security.oauth2.client.provider.oidc.jwk-set-uri=${PROTOVOY_COLLAB_OIDC_JWK_SET_URI:https://invalid.local/jwks}
spring.security.oauth2.client.provider.oidc.user-info-uri=${PROTOVOY_COLLAB_OIDC_USER_INFO_URI:https://invalid.local/userinfo}
spring.security.oauth2.client.provider.oidc.user-name-attribute=sub
