services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: protovoy
      POSTGRES_USER: protovoy
      POSTGRES_PASSWORD: ${PROTOVOY_COLLAB_DATABASE_PASSWORD:?set PROTOVOY_COLLAB_DATABASE_PASSWORD}
    volumes:
      - protovoy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protovoy"]
      interval: 5s
      timeout: 3s
      retries: 10
  collaboration:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8088:8088"]
    environment:
      PROTOVOY_COLLAB_DATABASE_URL: jdbc:postgresql://postgres:5432/protovoy
      PROTOVOY_COLLAB_DATABASE_USER: protovoy
      PROTOVOY_COLLAB_DATABASE_PASSWORD: ${PROTOVOY_COLLAB_DATABASE_PASSWORD}
      PROTOVOY_COLLAB_BOOTSTRAP_TOKEN: ${PROTOVOY_COLLAB_BOOTSTRAP_TOKEN:?set PROTOVOY_COLLAB_BOOTSTRAP_TOKEN}
      PROTOVOY_COLLAB_SSO_ENABLED: ${PROTOVOY_COLLAB_SSO_ENABLED:-false}
      PROTOVOY_COLLAB_SSO_ORGANIZATION_ID: ${PROTOVOY_COLLAB_SSO_ORGANIZATION_ID:-}
      PROTOVOY_COLLAB_SSO_WEB_REDIRECT: ${PROTOVOY_COLLAB_SSO_WEB_REDIRECT:-http://localhost:5180}
      PROTOVOY_COLLAB_OIDC_CLIENT_ID: ${PROTOVOY_COLLAB_OIDC_CLIENT_ID:-disabled}
      PROTOVOY_COLLAB_OIDC_CLIENT_SECRET: ${PROTOVOY_COLLAB_OIDC_CLIENT_SECRET:-disabled}
      PROTOVOY_COLLAB_OIDC_AUTHORIZATION_URI: ${PROTOVOY_COLLAB_OIDC_AUTHORIZATION_URI:-https://invalid.local/authorize}
      PROTOVOY_COLLAB_OIDC_TOKEN_URI: ${PROTOVOY_COLLAB_OIDC_TOKEN_URI:-https://invalid.local/token}
      PROTOVOY_COLLAB_OIDC_JWK_SET_URI: ${PROTOVOY_COLLAB_OIDC_JWK_SET_URI:-https://invalid.local/jwks}
      PROTOVOY_COLLAB_OIDC_USER_INFO_URI: ${PROTOVOY_COLLAB_OIDC_USER_INFO_URI:-https://invalid.local/userinfo}
volumes:
  protovoy-postgres:
